[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardbound"
version = "0.1.0"
description = "Reproduction of Steering Dialogue Dynamics for Robustness against Multi-turn Jailbreaking Attacks (arXiv:2503.00187)"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
