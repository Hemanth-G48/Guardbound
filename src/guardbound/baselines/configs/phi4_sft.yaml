# LLaMA-Factory config: Phi-4 + LoRA SFT
#
# Paper-specified (B.1):
#   learning_rate: 2e-4
#   num_train_epochs: 3
#
# Everything else below is LLaMA-Factory default (Not specified in
# the NBF paper) and recorded verbatim in the run manifest.

model_name_or_path: microsoft/phi-4
adapter_name_or_path: checkpoints/lora_sft/phi-4
output_dir: checkpoints/lora_sft/phi-4
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

# Paper-specified
learning_rate: 2.0e-4
num_train_epochs: 3

# LLaMA-Factory defaults (Not specified in the NBF paper)
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
max_grad_norm: 1.0
seed: 42
max_length: 2048
logging_steps: 10
save_steps: 500
dataset: phase8_sft_phi4
dataset_dir: data/processed/llama_factory
template: phi
plot_loss: true
report_to: none
